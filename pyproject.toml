[project]
name = "say-dictation"
version = "0.1.0"
description = "On-device push-to-talk voice dictation for macOS."
readme = "say/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ritik Yadav" }]
keywords = ["dictation", "speech-to-text", "whisper", "macos", "mlx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X :: Cocoa",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx-whisper==0.4.3",
    "sounddevice==0.5.5",
    "numpy>=2.0,<3.0",
    "pyobjc-framework-Cocoa==12.1",
    "pyobjc-framework-Quartz==12.1",
    "pynput==1.8.1",
    "pyperclip==1.11.0",
    "rumps==0.4.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sse-starlette>=2.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/example/say"

[tool.pytest.ini_options]
testpaths = ["say/tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "__pycache__"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
]
ignore = [
    "E501",   # long lines — covered by line-length but not strict
    "B008",   # function call in default arg
    "SIM105", # try/except/pass; sometimes clearer than contextlib.suppress
    "SIM117", # nested with — clearer when each guards its own scope
    "UP038",  # tuple isinstance suggestion is mostly noise
    "B904",   # `raise from` is noisy in defensive paths
    "C401",   # set comprehension nit
    "UP042",  # StrEnum migration is cosmetic; str+Enum inheritance is fine
]

[tool.ruff.lint.per-file-ignores]
"say/tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
files = ["say"]
exclude = ["build", "dist", ".*/__pycache__"]
