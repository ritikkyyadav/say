name: Linux

on:
  push:
    branches: [linux-release]
    tags: ['linux-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SAY_CI: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            say/requirements.txt
            say/requirements-linux.txt
            linux/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config dbus libportaudio2 libasound2-dev libasound2-plugins libegl1 libgl1 libopengl0 libxcb-icccm4 libxcb-keysyms1 libxcb-cursor0 libxkbcommon-x11-0 libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev patchelf file binutils xvfb xauth pulseaudio pulseaudio-utils espeak-ng ffmpeg openbox xcompmgr weston xdotool xclip scrot webkit2gtk-driver python3-gi gir1.2-gtk-3.0
      - name: Pinned Python dependencies
        id: dependencies
        run: python -m pip install -r linux/requirements-build.txt
      - name: Real Qt MIME and lock-signal contracts
        if: always() && steps.dependencies.outcome == 'success'
        run: dbus-run-session -- python linux/qt_smoke.py
      - name: Python lint and type check
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          python -m ruff check say linux
          python -m mypy say
      - name: Portable and Linux unit tests
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          xvfb-run -a python -m pytest say/tests --junitxml=linux-tests.xml \
            --ignore=say/tests/test_brand_assets.py \
            --ignore=say/tests/test_hotkey_fn.py \
            --ignore=say/tests/test_overlay_contrast.py \
            --ignore=say/tests/test_overlay_window.py \
            --ignore=say/tests/test_text_inject.py
      - name: Frontend startup tests and production build
        if: always() && steps.dependencies.outcome == 'success'
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Native WebDriver tool
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Freeze the native offline engine
        run: xvfb-run -a python linux/build_engine.py
      - name: Native launcher tests
        run: |
          TAURI_CONFIG="$(cat desktop/src-tauri/tauri.linux.conf.json)" cargo test --locked --release --features custom-protocol --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build Debian and AppImage packages
        id: packages
        working-directory: desktop
        run: npm run tauri:build -- --ci --config src-tauri/tauri.linux.conf.json --bundles deb,appimage
      - name: Packaged offline recognition and desktop delivery
        run: python linux/package_smoke.py
      - name: Keep native packages and provenance
        if: always() && steps.packages.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          compression-level: 0
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            say/build/linux/linux-build.json
          if-no-files-found: error
      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-source-checks-${{ matrix.arch }}
          path: |
            linux-tests.xml
            say/dist/linux-smoke/**/*.png
            say/dist/linux-smoke/**/gui-smoke.json
            say/dist/linux-smoke/**/cli-smoke.json
            say/dist/linux-smoke/package-smoke.json
            say/dist/linux-smoke/**/*.log
          if-no-files-found: ignore
