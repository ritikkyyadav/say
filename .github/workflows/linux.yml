name: Linux

on:
  push:
    branches: [linux-release]
    tags: ['linux-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SAY_CI: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            say/requirements.txt
            say/requirements-linux.txt
            linux/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libportaudio2 libasound2-dev libasound2-plugins libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Pinned Python dependencies
        run: python -m pip install -r linux/requirements-build.txt
      - name: Python lint and type check
        run: |
          python -m ruff check say
          python -m mypy say
      - name: Portable and Linux unit tests
        run: |
          python -m pytest say/tests --junitxml=linux-tests.xml \
            --ignore=say/tests/test_brand_assets.py \
            --ignore=say/tests/test_hotkey_fn.py \
            --ignore=say/tests/test_overlay_contrast.py \
            --ignore=say/tests/test_overlay_window.py \
            --ignore=say/tests/test_text_inject.py
      - name: Frontend startup tests and production build
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-source-checks-${{ matrix.arch }}
          path: linux-tests.xml
          if-no-files-found: ignore
