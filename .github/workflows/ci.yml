name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          brew install portaudio ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r say/requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check say

      - name: Type check (mypy)
        run: mypy say || true   # advisory until coverage matures

      - name: Tests
        working-directory: say
        env:
          # CI can't grant Accessibility/Input-Monitoring; skip pyobjc-tap tests.
          SAY_CI: '1'
        run: |
          python -m unittest discover -s tests -t . -v
