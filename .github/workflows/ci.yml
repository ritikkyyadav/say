name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          brew install portaudio ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r say/requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check say

      - name: Type check (mypy)
        run: mypy say

      - name: Tests
        env:
          # CI can't grant Accessibility/Input-Monitoring; skip pyobjc-tap tests.
          SAY_CI: '1'
        # pytest, not unittest discover: the session fixture in tests/conftest.py
        # that keeps every test away from real user files only runs under pytest,
        # and the fixture-based test modules are invisible to discover.
        run: pytest say/tests

  portable-core:
    # The engine core must keep importing with no PyObjC at all. On macOS this
    # cannot be observed by ordinary means — PyObjC is always present, so a
    # module that quietly grows an AppKit dependency imports fine and nobody
    # finds out until a Windows build is attempted. This job is what keeps the
    # eventual port a bounded job instead of a rewrite.
    name: Portable core (no PyObjC)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r say/requirements.txt pytest

      - name: Import the core with every Apple module blocked
        env:
          SAY_CI: '1'
        run: pytest say/tests/test_portability.py -v

  linux-core:
    # Linux is the most tractable second platform: every dependency has a
    # manylinux wheel (including onnxruntime, which is what the bundled
    # Moonshine model runs on), `fcntl` single-instance works as-is, and
    # `owner_watch` already falls back to polling where kqueue does not exist.
    #
    # This runs the 25 test modules that need no PyObjC — measured, not
    # guessed. The five that are excluded are genuinely macOS-only: the icon
    # renderer, the CGEventTap hotkey, the two overlay-drawing suites and
    # CGEvent/NSPasteboard injection. Those are the port surface.
    name: Engine core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System audio libraries
        # sounddevice binds PortAudio at import time.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        # The platform markers in requirements.txt drop mlx-whisper, pyobjc
        # and rumps here; what installs is the cross-platform engine.
        run: |
          python -m pip install --upgrade pip
          pip install -r say/requirements.txt pytest

      - name: Engine core tests
        env:
          SAY_CI: '1'
        run: |
          pytest say/tests \
            --ignore=say/tests/test_brand_assets.py \
            --ignore=say/tests/test_hotkey_fn.py \
            --ignore=say/tests/test_overlay_contrast.py \
            --ignore=say/tests/test_overlay_window.py \
            --ignore=say/tests/test_text_inject.py
